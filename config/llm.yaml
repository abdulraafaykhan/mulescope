# MuleScope LLM configuration (build prompt sections 2 and 7).
#
# Loaded by backend/app/core/config_files.py into LlmConfig. Model names,
# temperatures, token limits, timeouts and retry policy live here, never as
# literals in code. Keys come from the environment only (GROQ_API_KEY,
# GEMINI_API_KEY); never put keys in this file.
#
# Groq runs the Profiler, Flow Analyst and Critic on its small model and the
# Narrative Writer on its larger model (Gemini is selectable per agent, see
# narrative_writer below). Any failure falls back to the node's
# template implementation, so a run never fails because of an LLM.

version: "1.0.0"

providers:
  groq:
    # TODO verify: Groq retired llama-3.1-8b-instant / llama-3.3-70b-versatile for
    # self-serve accounts in Aug 2026; openai/gpt-oss-20b is listed as a production
    # model on console.groq.com/docs/models (checked Nov 2026).
    default_model: "openai/gpt-oss-20b"
    base_url: "https://api.groq.com/openai/v1"
  gemini:
    # TODO verify: gemini-3.8-flash is listed as stable on the Gemini API models page
    # (checked Nov 2026). Check the free-tier limits of your project.
    default_model: "gemini-3.8-flash"
    base_url: "https://generativelanguage.googleapis.com/v1beta"

agents:
  profiler:
    provider: groq
    model: "openai/gpt-oss-20b"
    temperature: 0
    reasoning_effort: low
    max_tokens: 1500
  flow_analyst:
    provider: groq
    model: "openai/gpt-oss-20b"
    temperature: 0
    reasoning_effort: low
    max_tokens: 1500
  narrative_writer:
    # To switch back to Gemini, set provider: gemini and model: "gemini-3.8-flash"
    # (and drop or change fallback_model). No code change needed. Gemini is not
    # reachable from the dev machine right now: gemini-3.8-flash and 3.7-flash
    # time out after 20 s, 3.6-flash returns 503.
    provider: groq
    model: "openai/gpt-oss-120b"
    # Tried when the primary fails or returns invalid output; same provider.
    fallback_model: "openai/gpt-oss-20b"
    temperature: 0
    # Low effort: the free tier allows about 8k tokens per minute per model, and a
    # medium-effort narrative plus critic round used most of it (HTTP 429).
    reasoning_effort: low
    # Thinking tokens count against the output budget on Gemini 3.x and gpt-oss models.
    max_tokens: 6000
  critic:
    provider: groq
    model: "openai/gpt-oss-20b"
    temperature: 0
    # gpt-oss reasons before it writes; at 1200 the reasoning used the whole budget on
    # some drafts and Groq answered 400 json_validate_failed with an empty failed_generation.
    # Low effort keeps the reasoning short so the JSON fits and the token rate stays down.
    reasoning_effort: low
    max_tokens: 3000

# Free-tier protection: one global semaphore across all agents.
limits:
  max_concurrency: 2
  # Wall-clock limit per provider call; starts after the semaphore is taken.
  call_timeout_seconds: 20
  # Attempts per call and model. A timeout is not retried on the same model.
  max_attempts: 2
  # Wall-clock limit per node: all attempts, the fallback model and the repair.
  node_budget_seconds: 40
  backoff_base_seconds: 2
  # A longer Retry-After skips to the next model instead of waiting.
  backoff_max_seconds: 5
  # One repair attempt when the output does not match the schema, then fall back.
  repair_attempts: 1

# Response cache. ttl_days is the source of the llm_cache created_at TTL index.
cache:
  ttl_days: 30

# Estimated cost and free-tier watch on the observability page. Prices are Groq
# list prices in USD per million tokens (not the free-tier bill, which is $0);
# the 50% discount Groq gives on cached prompt tokens is ignored, so estimates
# are an upper bound. A model missing here shows no cost.
# TODO verify: prices and the 8K tokens-per-minute free-plan limit against
# console.groq.com/docs (taken from third-party trackers, Nov 2026).
models:
  "openai/gpt-oss-20b":
    input_usd_per_million: 0.075
    output_usd_per_million: 0.30
    tokens_per_minute: 8000
  "openai/gpt-oss-120b":
    input_usd_per_million: 0.15
    output_usd_per_million: 0.60
    tokens_per_minute: 8000

# One llm_calls document per call attempt; call_log_ttl_days is the source of
# its created_at TTL index.
observability:
  call_log_ttl_days: 30
