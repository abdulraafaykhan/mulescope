[project]
name = "mulescope"
version = "0.1.0"
description = "MuleScope: LangGraph-based AML triage copilot for mule-account / rapid pass-through alerts."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.163.1",
    # ASGI server: FastAPI has no built-in server, `uv run dev` needs one.
    "uvicorn==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    # Native AsyncMongoClient. Motor is deprecated and must not be added.
    "pymongo==4.20.0",
    "langgraph==1.2.22",
    "langgraph-checkpoint-mongodb==0.5.1",
    # Section 10.2: thresholds, model names and limits live in config/*.yaml; stdlib has no YAML parser.
    "pyyaml==6.0.3",
    # Section 2: synthetic data with Faker (en_IN) and NumPy, seeded RNG.
    "faker==40.54.0",
    "numpy==2.5.5",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.5",
    "mypy==2.4.1",
    "pre-commit==4.7.0",
    # Dev-only: FastAPI's TestClient / httpx.ASGITransport need it and plain `fastapi`
    # does not pull it in. Never imported by app code.
    "httpx==0.28.1",
]

[project.scripts]
dev = "backend.app.main:run"
seed = "datagen.cli:main"
evals = "evals.cli:main"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Top-level packages importable from the mulescope/ root, e.g. backend.app.main.
packages = ["backend", "datagen", "evals"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # bugbear
    "SIM",   # simplify
    "ASYNC", # blocking calls in async code
    "T20",   # no print
    "RUF",   # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# CLI entry points print human-readable summaries to the console.
"datagen/*" = ["T20"]
"evals/*" = ["T20"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "backend/app/domain",
    "backend/app/services",
    "backend/app/graph",
]
explicit_package_bases = true
mypy_path = "."
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# pyyaml ships no inline types; types-PyYAML is not added (closed dependency list).
module = ["yaml", "yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"
testpaths = ["tests"]
markers = [
    "unit: fast tests with no external dependencies",
    "integration: tests that need a real local MongoDB",
]
